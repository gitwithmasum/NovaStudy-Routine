name: NovaStudy regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and regression tests
        run: |
          node --check challenge-data.js
          node --check auth-config.js
          node --check cloud.js
          node --check sync.js
          node --check auto-sync.js
          node --check auth.js
          node --check challenge.js
          node --check learning-hub.js
          node --check academic-reports.js
          node --check reminders.js
          node --check ui-personalization.js
          node --check diagnostics.js
          node --check portability.js
          node --check attendance.js
          node --check core.js
          node --check focus.js
          node --check focus-insights.js
          node --check i18n.js
          node --check dashboard.js
          node --check study-planner.js
          node --check course-manager.js
          node --check app.js
          node --check chronos-widget-data.js
          node --check chronos-widget-integration.js
          node --check views.js
          node --check editors.js
          node --check exams.js
          node --check exam-prep.js
          node --test tests/*.test.cjs
          node scripts/release-audit.cjs
          node scripts/performance-benchmark.cjs
