name: NovaStudy regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and regression tests
        run: |
          node --check attendance.js
          node --check core.js
          node --check focus.js
          node --check i18n.js
          node --check app.js
          node --check views.js
          node --check editors.js
          node --check exams.js
          node --test tests/*.test.cjs
