<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080e20" />
  <meta name="description" content="NovaStudy — a futuristic, offline-ready routine and task planner for students at every level." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NovaStudy" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png?v=1.3.1" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png?v=1.3.1" />
  <script>
    // Keep the user's appearance preference independent from routine and task data.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("novastudy_theme_v1") === "gold" ? "gold" : "cyber";
    } catch {
      document.documentElement.dataset.theme = "cyber";
    }
  </script>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./themes.css" />
  <link rel="stylesheet" href="./planner.css" />
  <link rel="stylesheet" href="./challenge.css" />
  <link rel="stylesheet" href="./auth.css" />
  <title>NovaStudy — Routine OS</title>
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#dashboard" aria-label="NovaStudy home">
        <img class="brand-image" src="./assets/icon-192.png" alt="" width="46" height="46" />
        <span><strong>NOVASTUDY</strong><small>ROUTINE OPERATING SYSTEM</small></span>
      </a>
      <div class="sidebar-caption">WORKSPACE / 01</div>
      <nav class="nav-list" aria-label="Pages">
        <button class="nav-btn active" data-nav="dashboard"><span class="nav-ico">▦</span><span>Dashboard</span><span class="nav-arrow">›</span></button>
        <button class="nav-btn" data-nav="schedule"><span class="nav-ico">▤</span><span>Weekly routine</span><span class="nav-arrow">›</span></button>
        <button class="nav-btn" data-nav="tasks"><span class="nav-ico">☑</span><span>Tasks & goals</span><span class="nav-arrow">›</span></button>
        <button class="nav-btn" data-nav="challenge"><span class="nav-ico">✧</span><span>CSE 100 Challenge</span><span class="nav-arrow">›</span></button>
        <button class="nav-btn" data-nav="focus"><span class="nav-ico">◉</span><span>Focus timer</span><span class="nav-arrow">›</span></button>
        <button class="nav-btn" data-nav="exams"><span class="nav-ico">◷</span><span>Exams & revision</span><span class="nav-arrow">›</span></button>
        <button class="nav-btn" data-nav="attendance"><span class="nav-ico">▤</span><span>Attendance & analytics</span><span class="nav-arrow">›</span></button>
        <button class="nav-btn" data-nav="subjects"><span class="nav-ico">◈</span><span>Subjects</span><span class="nav-arrow">›</span></button>
        <button class="nav-btn" data-nav="settings"><span class="nav-ico">⚙</span><span>My profile & settings</span><span class="nav-arrow">›</span></button>
      </nav>
    </aside>
    <main class="content">
      <header class="topbar">
        <div class="mobile-brand"><img class="brand-image mini" src="./assets/icon-192.png" alt="" width="30" height="30" /><b>NOVASTUDY</b></div>
        <div class="breadcrumb"><span class="breadcrumb-muted">WORKSPACE</span><span class="slash">/</span><span id="pageLabel">DASHBOARD</span></div>
        <div class="topbar-actions">
          <div class="clock" id="liveClock" aria-label="Local time">--:--</div>
          <button class="outline-button theme-switch" id="themeToggle" type="button"
            data-action="toggle-theme" aria-label="Switch theme" aria-pressed="false">
            <span class="theme-symbol" aria-hidden="true">◐</span><span id="themeLabel">Cyber</span>
          </button>
          <button class="outline-button language-switch" id="langToggle" type="button" data-action="toggle-language" aria-label="Switch interface language" title="Switch interface language"><span aria-hidden="true">文</span> <span id="langLabel">বাংলা</span></button>
          <button class="outline-button top-install" id="installBtn" type="button"><span>⇩</span> Install app</button>
          <button class="avatar-button" type="button" data-nav="settings" title="Profile" aria-label="Open profile">ST</button>
        </div>
      </header>
      <div id="recoveryNotice" class="reliability-notice" role="alert" hidden>
      <strong>⚠ Data safety alert</strong><span id="recoveryMessage"></span>
      <div class="reliability-actions"><button type="button" data-action="export">Export current backup</button><button type="button" data-action="export-recovery">Download raw recovery</button><button type="button" data-nav="settings">Open Settings</button><button type="button" data-action="dismiss-recovery">Dismiss</button></div>
    </div>
    <div id="updateNotice" class="reliability-notice update-notice" role="status" hidden>
      <strong>✦ NovaStudy update ready</strong><span>A newer version is downloaded. Your saved routines and exams will be kept.</span>
      <div class="reliability-actions"><button type="button" data-action="apply-update">Update and reload</button></div>
    </div>
    <div id="view" class="view"></div>
      <footer class="app-footer"><span>✦ NOVASTUDY OS <b>1.9.0</b></span><span>ENGINEERED FOR YOUR NEXT LEVEL</span></footer>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button data-nav="dashboard" class="active"><span>▦</span><small>Home</small></button>
    <button data-nav="schedule"><span>▤</span><small>Routine</small></button>
    <button data-nav="tasks"><span>☑</span><small>Tasks</small></button>
    <button data-nav="challenge"><span>✧</span><small>CSE 100</small></button>
    <button data-nav="focus"><span>◉</span><small>Focus</small></button>
    <button data-nav="exams"><span>◷</span><small>Exams</small></button>
    <button data-nav="attendance"><span>▤</span><small>Attend.</small></button>
    <button data-nav="subjects"><span>◈</span><small>Subjects</small></button>
    <button data-nav="settings"><span>⚙</span><small>Settings</small></button>
  </nav>
  <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./presets.js" defer></script>
  <script src="./i18n.js" defer></script>
  <script src="./core.js" defer></script>
  <script src="./auth-config.js" defer></script>
  <script src="./auth.js" defer></script>
  <script src="./views.js" defer></script>
  <script src="./editors.js" defer></script>
  <script src="./exams.js" defer></script>
  <script src="./focus.js" defer></script>
  <script src="./attendance.js" defer></script>
  <script src="./challenge-data.js" defer></script>
  <script src="./challenge.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
